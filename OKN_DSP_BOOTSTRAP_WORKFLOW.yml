name: OKN DSP Bootstrap

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -name 'OKN_DSP_APP_V3_PROTOCOL_CAPTURE_READY.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Project ZIP not found."
            exit 1
          fi

          rm -rf /tmp/okn_dsp_extract
          mkdir -p /tmp/okn_dsp_extract
          unzip -q "$ZIP" -d /tmp/okn_dsp_extract

          ROOT=$(find /tmp/okn_dsp_extract -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -n "$ROOT" ]; then
            cp -a "$ROOT"/. .
          else
            cp -a /tmp/okn_dsp_extract/. .
          fi

          rm -f "$ZIP"

      - name: Commit extracted project
        shell: bash
        run: |
          set -e
          git config user.name "OKN DSP Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No bootstrap changes."
          else
            git commit -m "Bootstrap OKN DSP project [skip ci]"
            git push
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OKN-DSP-v3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
